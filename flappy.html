<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flappy · Mohammad Shaikh</title>
  <meta name="description" content="A tiny arcade break. Flap to survive." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    :root {
      --bg: #000;
      --fg: #f5f5f7;
      --dim: #86868b;
      --accent: #0071e3;
      --accent-glow: rgba(0, 113, 227, 0.4);
      --panel: #0d0d0d;
      --line: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      user-select: none;
    }
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      z-index: 10;
      pointer-events: none;
    }
    .top-bar a {
      pointer-events: auto;
      color: var(--dim);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 200ms ease-out;
    }
    .top-bar a:hover { color: var(--fg); }
    .top-links { display: flex; gap: 16px; }
    .brand {
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.02em;
      text-transform: none;
      font-size: 15px;
    }
    .brand span { color: var(--accent); }
    .stage {
      position: relative;
      height: min(100dvh - 48px, (100vw - 24px) * 16 / 9, 746px);
      aspect-ratio: 9 / 16;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 113, 227, 0.06);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .score {
      font-weight: 700;
      font-size: 56px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #fff;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .best {
      text-align: center;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      padding: 32px;
      text-align: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.55) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    .overlay[hidden] { display: none; }
    .overlay h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .overlay .sub {
      font-size: 13px;
      color: var(--dim);
      max-width: 240px;
      line-height: 1.5;
    }
    .result {
      display: flex;
      gap: 18px;
      padding: 14px 20px;
      border-radius: 16px;
      background: #0a0a0a;
      border: 1px solid var(--line);
    }
    .result div { text-align: center; }
    .result .label {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .result .value {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .result .value.accent { color: var(--accent); }
    button.play {
      appearance: none;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.02em;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: transform 150ms ease-out, background-color 150ms ease-out;
    }
    button.play:hover { background: #0066cc; }
    button.play:active { transform: scale(0.97); }
    .hint {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    @media (max-height: 640px) {
      .score { font-size: 42px; }
      .overlay h1 { font-size: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      button.play { transition: none; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="brand" href="./">Mohammad<span>.</span></a>
    <span class="top-links"><a href="privacy.html">Privacy</a> <a href="./">← Back</a></span>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="360" height="640" aria-label="Flappy game"></canvas>
    <div class="hud">
      <div>
        <div class="score" id="score" aria-live="polite">0</div>
        <div class="best" id="bestLabel">BEST — 0</div>
      </div>
      <div></div>
    </div>

    <div class="overlay" id="startOverlay">
      <h1>Flap to fly.<br/>Don't crash.</h1>
      <p class="sub">Tap, click, or press Space.</p>
      <button class="play" id="startBtn">Start</button>
      <p class="hint">Space / Click / Tap</p>
    </div>

    <div class="overlay" id="gameOverOverlay" hidden>
      <h1>Game over.</h1>
      <div class="result">
        <div>
          <div class="label">Score</div>
          <div class="value accent" id="finalScore">0</div>
        </div>
        <div>
          <div class="label">Best</div>
          <div class="value" id="finalBest">0</div>
        </div>
        <div id="medalBox" hidden>
          <div class="label">Medal</div>
          <div class="value" id="finalMedal"></div>
        </div>
      </div>
      <button class="play" id="restartBtn">Play again</button>
      <p class="hint">Space / Click / Tap</p>
    </div>
  </div>

  <script type="module">
    import { FlappySim, STEP, MAX_FRAME, VIEW_H, GROUND_Y, BIRD_R, PIPE_HALF_W, GAP_HALF, medalFor } from './src/components/flappySim.js';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestLabelEl = document.getElementById('bestLabel');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const finalScoreEl = document.getElementById('finalScore');
    const finalBestEl = document.getElementById('finalBest');
    const medalBoxEl = document.getElementById('medalBox');
    const finalMedalEl = document.getElementById('finalMedal');

    let cssW = 360, cssH = 640, scale = cssH / VIEW_H;
    const toY = (y) => cssH / 2 - y * scale;
    const birdX = () => cssW * 0.28;

    // Match canvas pixel size to CSS size (handles high-DPI)
    function fitCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cssW = rect.width;
      cssH = rect.height;
      scale = cssH / VIEW_H;
    }

    let best = 0;
    try { best = parseInt(localStorage.getItem('flappy.best') || '0', 10) || 0; } catch {}
    bestLabelEl.textContent = `BEST — ${best}`;

    let sim = new FlappySim();
    let accumulator = 0;

    function reset() {
      sim = new FlappySim();
      accumulator = 0;
      scoreEl.textContent = '0';
      startOverlay.hidden = false;
      gameOverOverlay.hidden = true;
    }

    function start() {
      sim.flap();
      startOverlay.hidden = true;
      gameOverOverlay.hidden = true;
    }

    // Keyboard, click and tap all land here; 'over' needs the Play again button.
    function flap() {
      if (sim.state === 'ready') start();
      else sim.flap();
    }

    function die() {
      if (sim.score > best) {
        best = sim.score;
        try { localStorage.setItem('flappy.best', String(best)); } catch {}
      }
      bestLabelEl.textContent = `BEST — ${best}`;
      finalScoreEl.textContent = sim.score;
      finalBestEl.textContent = best;
      const medal = medalFor(sim.score);
      medalBoxEl.hidden = !medal;
      finalMedalEl.textContent = medal ?? '';
      gameOverOverlay.hidden = false;
    }

    function update(dt) {
      accumulator += Math.min(dt, MAX_FRAME);
      while (accumulator >= STEP) {
        accumulator -= STEP;
        const wasPlaying = sim.state === 'play';
        sim.step();
        scoreEl.textContent = sim.score;
        if (wasPlaying && sim.state === 'over') die();
      }
    }

    function drawBg() {
      // Deep gradient sky
      const g = ctx.createLinearGradient(0, 0, 0, cssH);
      g.addColorStop(0, '#050508');
      g.addColorStop(1, '#0a1324');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cssW, cssH);

      // Subtle star dots (deterministic positions via sine)
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      const skyH = Math.max(1, toY(GROUND_Y) - 20);
      for (let i = 0; i < 30; i++) {
        ctx.fillRect((i * 97) % cssW, (i * 53) % skyH, 1.2, 1.2);
      }
    }

    function drawPipe(p) {
      const w = PIPE_HALF_W * 2 * scale;
      const x = birdX() + (p.x - PIPE_HALF_W) * scale;
      const topH = toY(p.gapY + GAP_HALF);
      const bottomY = toY(p.gapY - GAP_HALF);
      const bottomH = toY(GROUND_Y) - bottomY;

      // Pipe body
      ctx.fillStyle = '#0071e3';
      ctx.fillRect(x, 0, w, topH);
      ctx.fillRect(x, bottomY, w, bottomH);

      // Inner shadow (right edge darker)
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x + w - 6, 0, 6, topH);
      ctx.fillRect(x + w - 6, bottomY, 6, bottomH);

      // Caps
      ctx.fillStyle = '#2997ff';
      ctx.fillRect(x - 3, topH - 14, w + 6, 14);
      ctx.fillRect(x - 3, bottomY, w + 6, 14);
    }

    function drawGround(view) {
      const y = toY(GROUND_Y);
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, y, cssW, cssH - y);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(0, y, cssW, 1);
      // Diagonal stripes
      ctx.fillStyle = 'rgba(0,113,227,0.08)';
      const offset = (view.scroll * scale) % 24;
      for (let x = -offset - 24; x < cssW; x += 24) {
        ctx.beginPath();
        ctx.moveTo(x, cssH - 10);
        ctx.lineTo(x + 10, cssH - 10);
        ctx.lineTo(x + 20, cssH);
        ctx.lineTo(x + 10, cssH);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawBird(view) {
      const r = BIRD_R * scale;
      ctx.save();
      ctx.translate(birdX(), toY(view.y));
      ctx.rotate(-view.rot);
      // Glow
      ctx.shadowColor = 'rgba(0,113,227,0.6)';
      ctx.shadowBlur = 18;
      // Body
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Beak
      ctx.fillStyle = '#f5c518';
      ctx.beginPath();
      ctx.moveTo(r - 2, -2);
      ctx.lineTo(r + 8, 0);
      ctx.lineTo(r - 2, 4);
      ctx.closePath();
      ctx.fill();
      // Eye
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();
      ctx.arc(3, -3, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function render() {
      const view = sim.view(accumulator / STEP);
      drawBg();
      for (const p of view.pipes) drawPipe(p);
      drawGround(view);
      drawBird(view);
    }

    let lastT = performance.now();
    function loop(now) {
      const dt = (now - lastT) / 1000;
      lastT = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    // Input
    function onFlap(e) {
      e.preventDefault();
      flap();
    }
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') onFlap(e);
      if (e.code === 'KeyR' && sim.state === 'over') reset();
    });
    document.getElementById('stage').addEventListener('pointerdown', (e) => {
      // Ignore clicks on buttons/overlay elements that have their own handlers
      if (e.target.closest('button, a')) return;
      onFlap(e);
    });
    startBtn.addEventListener('click', (e) => { e.stopPropagation(); start(); });
    restartBtn.addEventListener('click', (e) => { e.stopPropagation(); reset(); start(); });

    window.addEventListener('resize', fitCanvas);
    fitCanvas();
    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
